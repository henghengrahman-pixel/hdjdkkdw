<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Broadcast Control - Login</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(420px,100%);background:#11151d;border:1px solid #242a36;border-radius:20px;padding:28px;box-shadow:0 24px 70px #0008}.brand{font-weight:800;font-size:24px;margin-bottom:6px}.sub{color:#929baa;margin-bottom:24px}label{display:block;font-size:13px;color:#b9c0cc;margin:14px 0 7px}input{width:100%;background:#0b0e14;border:1px solid #2a3140;border-radius:11px;padding:13px 14px;color:white;outline:none}input:focus{border-color:#6578ff}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#fff;color:#111;font-weight:800;cursor:pointer}.flash{background:#32151b;border:1px solid #74303d;color:#ffd7df;padding:10px 12px;border-radius:10px;margin-bottom:16px}
  </style>
</head>
<body><main class="card"><div class="brand">Broadcast Control</div><div class="sub">Masuk ke dashboard administrator</div>
{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}
<form method="post"><label>ID Admin</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Masuk</button></form></main></body></html>
